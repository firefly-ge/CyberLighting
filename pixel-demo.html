<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a0b" />
    <title>Pixel Light Demo — CyberLighting</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
      :root { color:#eff7f3; background:#070a0b; font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
      * { box-sizing:border-box; }
      body { min-width:320px; min-height:100vh; margin:0; background:radial-gradient(circle at 72% 18%,#123b35 0,transparent 34rem),#070a0b; }
      button,input { font:inherit; }
      button { cursor:pointer; }
      .shell { width:min(1240px,100%); min-height:100vh; margin:auto; padding:2rem clamp(1.25rem,5vw,4.5rem) 3rem; }
      .top { display:flex; align-items:center; justify-content:space-between; gap:1rem; }
      .brand { display:inline-flex; align-items:center; gap:.65rem; color:#eff7f3; font-size:.84rem; font-weight:700; letter-spacing:-.03em; text-decoration:none; }
      .mark { display:grid; grid-template-columns:repeat(3,4px); gap:2px; align-items:end; height:16px; }.mark i { width:4px; background:#75f0c5; box-shadow:0 0 8px #75f0c5; }.mark i:nth-child(1){height:7px}.mark i:nth-child(2){height:14px}.mark i:nth-child(3){height:10px}
      .tag { color:rgba(239,247,243,.52); font-family:'DM Mono',monospace; font-size:.62rem; letter-spacing:.1em; }
      .layout { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(290px,.75fr); align-items:center; gap:clamp(2rem,7vw,7rem); padding-top:clamp(3rem,9vh,6rem); }
      .eyebrow { margin:0 0 1rem; color:#75f0c5; font-family:'DM Mono',monospace; font-size:.65rem; letter-spacing:.12em; }
      h1 { max-width:700px; margin:.8rem 0 1.6rem; font-size:clamp(2.8rem,6vw,5.8rem); line-height:1.05; letter-spacing:-.075em; } h1 strong { color:#75f0c5; font-weight:700; }
      .lead { max-width:520px; margin:0; color:rgba(239,247,243,.7); font-size:1rem; line-height:1.9; }
      .workbench { display:grid; gap:1.15rem; margin-top:2.1rem; }.upload { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.85rem .9rem .85rem 1rem; border:1px solid rgba(255,255,255,.22); border-radius:5px; background:rgba(5,14,13,.46); }.upload-copy span,.label { display:block; color:rgba(239,247,243,.48); font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.08em; }.upload-copy b { display:block; margin-top:.22rem; font-size:.82rem; font-weight:500; }.upload input { position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; }.upload-button { flex:0 0 auto; border:0; border-radius:999px; padding:.65rem .9rem; color:#07100b; background:#75f0c5; font-size:.75rem; font-weight:700; }
      .control-row { display:flex; flex-wrap:wrap; gap:.9rem 1.2rem; align-items:end; }.control { display:grid; gap:.48rem; }.segments { display:flex; padding:3px; border:1px solid rgba(255,255,255,.18); border-radius:5px; background:rgba(3,9,8,.42); }.segments label { padding:.36rem .55rem; color:rgba(239,247,243,.55); font-size:.72rem; cursor:pointer; }.segments input { position:absolute; opacity:0; }.segments input:checked + span { color:#07100b; background:#75f0c5; border-radius:3px; font-weight:700; }.segments span { display:block; padding:.04rem; }
      .panel { position:relative; border:1px solid rgba(255,255,255,.19); border-radius:10px; padding:clamp(1rem,2.4vw,1.5rem); background:rgba(5,13,12,.68); box-shadow:20px 30px 80px rgba(0,0,0,.3); }.canvas-shell { position:relative; overflow:hidden; border-radius:5px; background:#081310; aspect-ratio:1; }.canvas-shell::after { content:'LIVE · LOCAL ONLY'; position:absolute; top:.7rem; left:.75rem; color:rgba(255,255,255,.46); font-family:'DM Mono',monospace; font-size:.56rem; letter-spacing:.08em; pointer-events:none; }.canvas-shell canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }.meta { display:flex; justify-content:space-between; gap:1rem; padding:.9rem .1rem 0; color:rgba(239,247,243,.52); font-family:'DM Mono',monospace; font-size:.61rem; letter-spacing:.06em; }.meta strong { color:#75f0c5; font-weight:500; }
      .note { margin-top:1.3rem; padding-top:1.1rem; border-top:1px solid rgba(255,255,255,.14); color:rgba(239,247,243,.48); font-size:.69rem; line-height:1.65; }
      @media(max-width:820px){.layout{grid-template-columns:1fr;gap:2.3rem;padding-top:3.5rem}.panel{max-width:560px}.tag{display:none}} @media(max-width:480px){.shell{padding:1.3rem 1rem 2rem}h1{font-size:3rem}.upload{align-items:flex-start;flex-direction:column}.upload-button{width:100%}.control-row{display:grid;grid-template-columns:1fr}.segments{width:100%;justify-content:space-between}.segments label{padding:.4rem .25rem}}
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <a class="brand" href="/"><span class="mark"><i></i><i></i><i></i></span>CyberLighting</a>
        <span class="tag">PIXEL LIGHT / DEMO 01</span>
      </header>
      <section class="layout">
        <div>
          <p class="eyebrow">PHOTO → LIVING PIXELS</p>
          <h1>把照片变成<br /><strong>会呼吸的灯画。</strong></h1>
          <p class="lead">上传一张照片。它只会在你的浏览器中被处理成拼豆般的色块，并成为一面会缓慢流动的像素灯墙。</p>
          <div class="workbench">
            <label class="upload" for="image-upload">
              <span class="upload-copy"><span>YOUR IMAGE · LOCAL PROCESSING</span><b id="file-name">试试你的照片，或先看默认灯画</b></span>
              <span class="upload-button">上传图片</span>
              <input id="image-upload" type="file" accept="image/*" />
            </label>
            <div class="control-row">
              <div class="control"><span class="label">PIXEL GRID</span><div class="segments" role="radiogroup" aria-label="像素网格大小">
                <label><input type="radio" name="grid-size" value="8" /><span>8×8</span></label>
                <label><input type="radio" name="grid-size" value="16" /><span>16×16</span></label>
                <label><input type="radio" name="grid-size" value="20" checked /><span>20×20</span></label>
                <label><input type="radio" name="grid-size" value="32" /><span>32×32</span></label>
              </div></div>
              <div class="control"><span class="label">MOTION</span><div class="segments" role="radiogroup" aria-label="灯光动效">
                <label><input type="radio" name="motion" value="breathe" checked /><span>呼吸</span></label>
                <label><input type="radio" name="motion" value="ripple" /><span>波浪</span></label>
                <label><input type="radio" name="motion" value="sparkle" /><span>星闪</span></label>
              </div></div>
            </div>
          </div>
          <p class="note">不上传、不保存图片。默认灯画是程序生成的示例；上传后，色块会依据你的图片重新生成。</p>
        </div>
        <div class="panel">
          <div class="canvas-shell"><canvas id="pixel-canvas" width="720" height="720" aria-label="动态像素灯画"></canvas></div>
          <div class="meta"><span><strong id="grid-label">20 × 20</strong> PIXELS</span><span id="motion-label">SLOW BREATHE</span></div>
        </div>
      </section>
    </main>
    <script>
      const canvas = document.querySelector('#pixel-canvas');
      const context = canvas.getContext('2d');
      const imageInput = document.querySelector('#image-upload');
      const fileName = document.querySelector('#file-name');
      const gridLabel = document.querySelector('#grid-label');
      const motionLabel = document.querySelector('#motion-label');
      const sourceCanvas = document.createElement('canvas');
      const sourceContext = sourceCanvas.getContext('2d', { willReadFrequently: true });
      const sampleCanvas = document.createElement('canvas');
      const sampleContext = sampleCanvas.getContext('2d', { willReadFrequently: true });
      let gridSize = Number(localStorage.getItem('pixel-light.grid') || 20);
      let motion = localStorage.getItem('pixel-light.motion') || 'breathe';
      let imageReady = false;
      let pixels = [];

      function makeSeedArtwork() {
        sourceCanvas.width = sourceCanvas.height = 480;
        const g = sourceContext;
        g.fillStyle = '#061814'; g.fillRect(0, 0, 480, 480);
        g.fillStyle = '#0b4b41'; g.fillRect(0, 270, 480, 210);
        g.fillStyle = '#164f78'; g.beginPath(); g.arc(240, 235, 138, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#75f0c5'; g.beginPath(); g.arc(240, 235, 104, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#071615'; g.beginPath(); g.moveTo(135, 90); g.lineTo(190, 160); g.lineTo(162, 220); g.closePath(); g.fill(); g.beginPath(); g.moveTo(345, 90); g.lineTo(290, 160); g.lineTo(318, 220); g.closePath(); g.fill();
        g.fillStyle = '#0a2924'; g.beginPath(); g.arc(240, 265, 116, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#f0d36b'; g.fillRect(190, 230, 25, 25); g.fillRect(266, 230, 25, 25);
        g.fillStyle = '#071615'; g.fillRect(198, 238, 9, 9); g.fillRect(274, 238, 9, 9); g.fillRect(222, 300, 36, 13);
        g.fillStyle = '#ed7566'; g.fillRect(231, 286, 18, 15);
        for (let i = 0; i < 32; i++) { g.fillStyle = i % 2 ? '#4cb69e' : '#2a8073'; g.fillRect((i * 71) % 470, (i * 113) % 260, 11, 11); }
        imageReady = true;
      }

      function quantize(value) { return Math.round(value / 32) * 32; }
      function rebuildPixels() {
        sampleCanvas.width = sampleCanvas.height = gridSize;
        sampleContext.imageSmoothingEnabled = true;
        sampleContext.clearRect(0, 0, gridSize, gridSize);
        sampleContext.drawImage(sourceCanvas, 0, 0, gridSize, gridSize);
        const data = sampleContext.getImageData(0, 0, gridSize, gridSize).data;
        pixels = Array.from({ length: gridSize * gridSize }, (_, index) => {
          const offset = index * 4;
          return [quantize(data[offset]), quantize(data[offset + 1]), quantize(data[offset + 2])];
        });
        gridLabel.textContent = `${gridSize} × ${gridSize}`;
      }

      function draw(timestamp) {
        const time = timestamp / 1000;
        const cell = canvas.width / gridSize;
        context.fillStyle = '#07110f'; context.fillRect(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < gridSize; y++) for (let x = 0; x < gridSize; x++) {
          const [red, green, blue] = pixels[y * gridSize + x] || [0, 0, 0];
          const distance = Math.hypot(x - (gridSize - 1) / 2, y - (gridSize - 1) / 2);
          let amount = .68 + .28 * Math.sin(time * 1.3);
          if (motion === 'ripple') amount = .58 + .38 * Math.sin(time * 3.2 - distance * .72);
          if (motion === 'sparkle') amount = .6 + .34 * Math.max(0, Math.sin(time * 2.1 + x * 5.1 + y * 3.7));
          context.fillStyle = `rgb(${Math.round(red * amount)} ${Math.round(green * amount)} ${Math.round(blue * amount)})`;
          context.fillRect(x * cell + 2, y * cell + 2, cell - 4, cell - 4);
        }
        requestAnimationFrame(draw);
      }

      function syncControls() {
        document.querySelector(`input[name="grid-size"][value="${gridSize}"]`).checked = true;
        document.querySelector(`input[name="motion"][value="${motion}"]`).checked = true;
        motionLabel.textContent = ({ breathe: 'SLOW BREATHE', ripple: 'CENTRE RIPPLE', sparkle: 'SOFT SPARKLE' })[motion];
      }

      document.querySelectorAll('input[name="grid-size"]').forEach((input) => input.addEventListener('change', () => {
        gridSize = Number(input.value); localStorage.setItem('pixel-light.grid', String(gridSize)); rebuildPixels(); syncControls();
      }));
      document.querySelectorAll('input[name="motion"]').forEach((input) => input.addEventListener('change', () => {
        motion = input.value; localStorage.setItem('pixel-light.motion', motion); syncControls();
      }));
      imageInput.addEventListener('change', () => {
        const [file] = imageInput.files;
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const image = new Image();
          image.onload = () => {
            sourceCanvas.width = sourceCanvas.height = 480;
            const scale = Math.max(480 / image.width, 480 / image.height);
            const width = image.width * scale, height = image.height * scale;
            sourceContext.clearRect(0, 0, 480, 480);
            sourceContext.drawImage(image, (480 - width) / 2, (480 - height) / 2, width, height);
            imageReady = true; fileName.textContent = file.name; rebuildPixels();
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
      makeSeedArtwork(); rebuildPixels(); syncControls(); requestAnimationFrame(draw);
    </script>
  </body>
</html>
