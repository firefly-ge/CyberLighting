<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060607" />
    <title>Pixel Heart — CyberLighting</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
      :root{color:#f5eded;background:#060607;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}.page{display:grid;min-height:100vh;grid-template-columns:minmax(0,.9fr) minmax(460px,1.1fr);gap:clamp(2rem,8vw,10rem);align-items:center;width:min(1380px,100%);margin:auto;padding:2rem clamp(1.25rem,6vw,6rem)}*{box-sizing:border-box}body{min-width:320px;margin:0;background:radial-gradient(circle at 77% 47%,#351116 0,transparent 34rem),#060607}.identity{position:absolute;top:2rem;left:clamp(1.25rem,6vw,6rem);display:flex;align-items:center;gap:.6rem;color:#f8eeee;font-size:.82rem;font-weight:700}.bars{display:grid;grid-template-columns:repeat(3,4px);gap:2px;align-items:end;height:16px}.bars i{width:4px;background:#ff6171;box-shadow:0 0 9px #ff6171}.bars i:nth-child(1){height:6px}.bars i:nth-child(2){height:14px}.bars i:nth-child(3){height:9px}.eyebrow{margin:0;color:#ff7e89;font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.13em}h1{max-width:610px;margin:1rem 0 1.6rem;font-size:clamp(3.2rem,7vw,6.8rem);font-weight:700;line-height:1.05;letter-spacing:-.08em}h1 strong{color:#ff6676}.copy{max-width:470px;margin:0;color:rgba(245,237,237,.68);font-size:1rem;line-height:1.9}.legend{display:flex;flex-wrap:wrap;gap:.9rem 1.4rem;margin-top:2rem;color:rgba(245,237,237,.5);font-family:'DM Mono',monospace;font-size:.61rem;letter-spacing:.06em}.legend b{display:inline-block;width:8px;height:8px;margin-right:.4rem;border-radius:2px;background:#ff6474;box-shadow:0 0 8px #ff6474}.legend span:nth-child(2) b{background:#8b242e;box-shadow:none}.stage{position:relative;overflow:hidden;border:1px solid rgba(255,197,203,.22);border-radius:12px;padding:clamp(1rem,2.8vw,1.8rem);background:rgba(23,6,8,.55);box-shadow:20px 32px 95px rgba(0,0,0,.45)}.stage::before{content:'PIXEL HEART / 28 × 28';position:absolute;z-index:2;top:1.2rem;left:1.35rem;color:rgba(255,230,232,.5);font-family:'DM Mono',monospace;font-size:.57rem;letter-spacing:.08em}.stage::after{content:'EXPANDING · BREATHING';position:absolute;z-index:2;right:1.35rem;bottom:1.15rem;color:#ff7e89;font-family:'DM Mono',monospace;font-size:.57rem;letter-spacing:.08em}.canvas-wrap{aspect-ratio:1;overflow:hidden;border-radius:6px;background:#0b0708}.canvas-wrap canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.caption{position:absolute;z-index:2;bottom:1.15rem;left:1.35rem;color:rgba(255,230,232,.44);font-family:'DM Mono',monospace;font-size:.57rem;letter-spacing:.08em}@media(max-width:900px){.page{grid-template-columns:1fr;gap:2.5rem;padding-top:6.2rem}.stage{max-width:610px}.identity{top:1.5rem}}@media(max-width:460px){.page{padding:5.5rem 1rem 1.5rem}h1{font-size:3.1rem}.stage{padding:1rem}.stage::before{top:.75rem;left:.85rem}.stage::after{right:.85rem;bottom:.8rem}.caption{bottom:.8rem;left:.85rem}}
    </style>
  </head>
  <body>
    <div class="identity"><span class="bars"><i></i><i></i><i></i></span>CyberLighting</div>
    <main class="page">
          <section>
            <p class="eyebrow">A LIVING GRID / DEMO 02</p>
            <h1>让一颗心<br /><strong>逐格呼吸。</strong></h1>
            <p class="copy">这不是缩放的图标。爱心由 28 × 28 个独立方格构成：中心格子先苏醒，亮度向外扩散，逐格组成一颗更大的心。</p>
        <div class="legend"><span><b></b>ACTIVE PIXEL</span><span><b></b>RESTING GRID</span><span>5 SECOND CYCLE</span></div>
      </section>
          <section class="stage" aria-label="动态像素爱心"><div class="canvas-wrap"><canvas id="heart-canvas" width="840" height="840"></canvas></div><span class="caption">EACH CELL HAS ITS OWN PHASE</span></section>
    </main>
    <script>
      const GRID_SIZE = 28;
      const canvas = document.querySelector('#heart-canvas');
      const context = canvas.getContext('2d');
      const CELL = canvas.width / GRID_SIZE;

      function heartDistance(x, y) {
        return Math.pow(x * x + y * y - 1, 3) - x * x * Math.pow(y, 3);
      }

      function draw(timestamp) {
        const seconds = timestamp / 1000;
        context.fillStyle = '#0b0708';
        context.fillRect(0, 0, canvas.width, canvas.height);
        for (let row = 0; row < GRID_SIZE; row++) for (let column = 0; column < GRID_SIZE; column++) {
          const x = (column - (GRID_SIZE - 1) / 2) / (GRID_SIZE * .24);
          const y = ((GRID_SIZE - 1) / 2 - row) / (GRID_SIZE * .24) - .18;
          const inside = heartDistance(x, y) <= 0;
          const cellTempo = 1.2 + ((column * 13 + row * 7) % 9) * .08;
          const cellPhase = column * .47 + row * .31 + Math.hypot(column - 13.5, row - 13.5) * .22;
          const cellPulse = (Math.sin(seconds * cellTempo * 2.4 + cellPhase) + 1) / 2;
          const edgeDelay = Math.min(.62, Math.hypot(x, y + .14) * .46);
          const globalBreath = .36 + (Math.sin(seconds * 1.25 - Math.PI / 2) + 1) * .32;
          const localDrift = (cellPulse - .5) * .09;
          const activation = Math.max(0, Math.min(1, (globalBreath + localDrift - edgeDelay) / .42));
          const brightness = inside ? .08 + activation * (.38 + cellPulse * .54) : .05;
          const red = Math.round(78 + 177 * brightness);
          const green = Math.round(13 + 56 * brightness);
          const blue = Math.round(22 + 66 * brightness);
          context.fillStyle = `rgb(${red} ${green} ${blue})`;
          context.fillRect(column * CELL + 3, row * CELL + 3, CELL - 6, CELL - 6);
        }
        requestAnimationFrame(draw);
      }

      draw(0);
    </script>
  </body>
</html>
