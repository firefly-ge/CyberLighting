<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><link rel="stylesheet" href="./assets/prototype.css" /><title>Pixel Studio — CyberLighting</title></head>
<body class="workspace-body"><header class="workspace-bar"><a class="brand" href="./index.html"><span class="brand-grid" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>CyberLighting</a><span class="prototype-badge">Advanced preview</span><div class="actions"><a class="button button-small" href="./explore.html">Exit</a><button class="button button-primary button-small" type="button">Preview</button></div></header>
<main class="studio-shell">
  <aside class="studio-tools" aria-label="Drawing tools"><button data-tool="brush" data-active title="Brush">●</button><button data-tool="eraser" title="Eraser">◇</button><button data-tool="fill" title="Fill">▨</button><button data-tool="select" title="Select">⌗</button><button data-tool="undo" title="Undo">↶</button></aside>
  <section class="studio-stage"><div class="studio-topline"><span>UNTITLED SIGNAL</span><div data-density-mode><button type="button" data-active>Auto</button><button type="button">Bold</button><button type="button">Fine</button><button type="button">Custom</button></div></div><canvas data-studio-canvas aria-label="Interactive pixel drawing canvas"></canvas><div class="rotate-notice">Rotate the device for the full editor preview.</div></section>
  <aside class="studio-inspector"><section><span class="micro-label">Layers</span><div class="layer-list" data-layer-list><button data-active>01 / Artwork</button><button>00 / Background</button></div><button class="button button-small">＋ Add layer</button></section><section><span class="micro-label">Selection</span><label class="control-block">Color<input type="color" value="#C8FF32" data-studio-color /></label><label class="control-block">Motion<select><option>Whole shape breathes</option><option>Wave through selection</option><option>Progressive light</option></select></label></section></aside>
  <footer class="studio-timeline"><span class="micro-label">Loop / 4 seconds</span><div class="timeline-track"><i></i><b></b><b></b><b></b><b></b></div></footer>
</main><div class="toast" data-toast role="status" aria-live="polite" hidden></div><script type="module" src="./assets/shell.js"></script><script type="module" src="./assets/pages/studio.js"></script></body></html>
